<!DOCTYPE html>
<html lang="en">

<script>

    theme: {

  }

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="/static/css/style.css">

<body class="min-h-screen text-slate-800">
