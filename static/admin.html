<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ServiceHub Admin — Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: '#4f46e5', dark: '#4338ca', deep: '#1e1b4b' },
          accent: '#10b981',
          warn: '#f59e0b',
        },
        fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'] },
      }
    }
  }
</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="/static/css/style.css">
<style>
  body { background: radial-gradient(1200px 600px at 100% -10%, rgba(79,70,229,.25), transparent), #0b0a1f; color: #e2e8f0; }
  .adm-glass { background: rgba(30,27,75,.5); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.08); }
  .adm-card-hover { transition: all .2s ease; }
  .adm-card-hover:hover { border-color: rgba(79,70,229,.5); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #312e81; border-radius: 999px; }
</style>
</head>
<body class="min-h-screen">

<div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 w-full max-w-sm px-4 sm:px-0"></div>
<div id="modal-root"></div>

<div id="gate" class="min-h-screen flex items-center justify-center px-4"></div>

<div id="admin-shell" class="hidden">
  <nav class="sticky top-0 z-40 adm-glass">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-2xl brand-gradient flex items-center justify-center shadow-md shadow-indigo-950"><i data-lucide="shield" class="w-5 h-5 text-white"></i></div>
        <div class="leading-none">
          <div class="font-extrabold text-lg tracking-tight text-white">ServiceHub</div>
          <div class="text-[10px] font-semibold text-indigo-300 tracking-wide -mt-0.5">ADMIN CONTROL CENTER</div>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <a href="/" class="text-xs font-bold text-indigo-300 hover:text-white transition px-3 py-2 rounded-xl hover:bg-white/5">← Customer Site</a>
        <button onclick="adminLogout()" class="p-2 rounded-xl hover:bg-white/10 text-indigo-300 hover:text-white transition"><i data-lucide="log-out" class="w-4 h-4"></i></button>
      </div>
    </div>
  </nav>
  <main class="max-w-7xl mx-auto px-4 sm:px-6 pb-24 pt-8" id="admin-app"></main>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/admin.js"></script>
</body>
</html>
